name: Build plugin release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        run: |
          node -e '
            const version = require("./manifest.json").version;
            if (version !== process.env.RELEASE_TAG || version !== require("./package.json").version) {
              throw new Error("Release tag, manifest.json and package.json versions must match");
            }
          '
      - run: npm ci
      - run: npm run build
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes main.js styles.css manifest.json
